# Native Home Assistant API. Optional: the dashboard works without Home
# Assistant, so the API never reboots the panel when no client connects.
# The encryption key is provisioned by Home Assistant on adoption.

api:
  reboot_timeout: 0s
  encryption: {}
  actions:
    # Connect from Home Assistant: Social Home calls this through Home
    # Assistant (esphome.<node name, - → _>_connect_social_home) with its
    # address and a one-time claim (single use, 10 minutes), sealed to the
    # panel's key (the "Social Home key" sensor below): HA keeps action data
    # in its recorder, so it only ever sees ciphertext. The panel opens
    # it and trades the claim for a token at
    # POST <url>/api/display/v1/pair/claim; an existing pairing is replaced.
    - action: connect_social_home
      description: Connect this panel to a Social Home household (started by Connect in Social Home).
      variables:
        sealed:
          type: string
          description: >-
            Social Home's address and one-time connect claim, sealed to this
            panel's Social Home key.
      then:
        - lambda: id(socialhome).connect_from_home_assistant(sealed);

text_sensor:
  - platform: socialhome_display
    socialhome_display_id: socialhome
    status:
      name: Social Home status
    # Social Home looks this entity up in Home Assistant's entity registry by
    # its name, which must stay exactly "Social Home node": HA's device
    # registry only has the friendly name, and the node name is what the
    # connect_social_home action is registered under.
    node:
      name: Social Home node
    # The panel's public key Social Home seals the connect claim to. Found by
    # its name like "Social Home node", so it must stay exactly
    # "Social Home key". Renewed on Forget server and after a factory reset.
    key:
      name: Social Home key
    # Whether the household's admin lets Home Assistant lift the privacy
    # lock below ("Home Assistant may unlock wall panels"): allowed / off.
    # Keeps its last value while the panel is unpaired or pairing.
    ha_unlock:
      name: Social Home HA unlock

# The panel's privacy lock (the lock screen with its PIN pad). Its state
# follows the panel: locked or unlocked from the PIN pad, by an admin in
# Social Home or from here; locking / unlocking while Social Home is asked;
# jammed while the panel can't lock (not paired, pairing, an update needed,
# or Social Home out of reach). Locking needs a household PIN; unlocking
# needs the admin's "Home Assistant may unlock wall panels" (the panel logs
# why otherwise and stays locked). Not optimistic: the lambda reports what
# the panel does (read every loop; ESPHome's lock publishes changes only).
lock:
  - platform: template
    id: privacy_lock
    name: Privacy lock
    icon: mdi:lock
    lambda: return id(socialhome).privacy_lock_state();
    lock_action:
      - lambda: id(socialhome).lock_from_home_assistant();
    unlock_action:
      - lambda: id(socialhome).unlock_from_home_assistant();
