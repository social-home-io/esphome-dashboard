name: Nightly (ESPHome dev)

# Early warning: compile every device against ESPHome's dev branch. A failure
# here never blocks a PR; it shows up as a warning on the run summary.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: Device matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "matrix=$(python3 scripts/device_matrix.py)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.slug }} (ESPHome dev)
    needs: matrix
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome dev
        run: pip install "esphome @ https://github.com/esphome/esphome/archive/refs/heads/dev.zip"
      - name: esphome compile
        id: compile
        continue-on-error: true
        run: esphome compile "builds/${{ matrix.slug }}.factory.yaml"
      - name: Warn on failure
        if: steps.compile.outcome == 'failure'
        run: |
          echo "::warning::${{ matrix.slug }} does not compile against ESPHome dev"
          echo "### ${{ matrix.slug }} fails against ESPHome dev" >> "$GITHUB_STEP_SUMMARY"
