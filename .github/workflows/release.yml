name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and redeploy (YYYY.M.D[.N])
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and device matrix
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]{4}\.[1-9][0-9]?\.[1-9][0-9]?(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not CalVer YYYY.M.D[.N] (no v prefix)"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}
      - id: matrix
        run: echo "matrix=$(python3 scripts/device_matrix.py)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.slug }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Load pinned ESPHome version
        run: echo "ESPHOME_VERSION=$(sed -n 's/^esphome==//p' .github/esphome-requirements.txt)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome ${{ env.ESPHOME_VERSION }}
        run: pip install -r .github/esphome-requirements.txt
      - name: esphome compile
        run: esphome -s firmware_version "${TAG}" compile "builds/${{ matrix.slug }}.factory.yaml"
      - name: Collect firmware
        run: scripts/collect_firmware.sh "${{ matrix.slug }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.slug }}
          path: dist/
          if-no-files-found: error

  attach:
    name: Attach images to the release
    needs: [prepare, build]
    # One upload once every device built: a merge deploying Pages meanwhile
    # sees either no images (and keeps the live site) or all of them.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/*.bin --clobber --repo "${GITHUB_REPOSITORY}"

  pages:
    name: Deploy installer and update manifests
    needs: attach
    # A pre-release must not replace the update manifest every panel polls:
    # it gets its binaries on the release page only. (pages.yml deploys the
    # latest stable release, which skips pre-releases anyway.)
    if: ${{ !github.event.release.prerelease }}
    # Same build as every merge to main: docs/ from main plus the latest
    # published release's firmware, which is now this one.
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
