# Fonts for the Guition JC8012P4A1 (1280x800).
#
# Roboto (SIL OFL 1.1, from Google Fonts) stands in for the browser dashboard's system-ui stack
# (system-ui, ..., Roboto). GF_Latin_Core covers the dashboard languages
# (en, de, es, fr, nl) and its punctuation (› … – — · •). Sizes come from
# packages.yaml substitutions, matching dashboard.css at 1280x800, so a larger
# panel scales them with the layout. The two clock fonts carry digits only.

font:
  - id: font_small
    file: "gfonts://Roboto"
    size: ${font_size_small}
    glyphsets: [GF_Latin_Core]
    # Roboto has no standalone combining accents; precomposed letters exist.
    ignore_missing_glyphs: true
  - id: font_label
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_small}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_body
    file: "gfonts://Roboto"
    size: ${font_size_body}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_body_bold
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_body}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_large
    file: "gfonts://Roboto"
    size: ${font_size_large}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_title
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_title}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_display
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_display}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_clock
    file: "gfonts://Roboto"
    size: ${font_size_clock}
    glyphs: "0123456789:. APM"
  # The night clock (.dash-night-clock: clamp(5rem, min(22vw, 30vh), 12rem),
  # weight 200 — 192 px at 1280x800).
  - id: font_night
    file: {type: gfonts, family: Roboto, weight: 200}
    size: ${font_size_night}
    glyphs: "0123456789:. APM"
  # The night date and "Tomorrow …" line (.dash-night-date / -next, 32 px at
  # 1280x800) and the lock screen's date (.dash-lock-date, 32 px).
  - id: font_text_large
    file: "gfonts://Roboto"
    size: ${font_size_text_large}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # The lock screen (lock.html.j2 + dashboard.css): its clock (.dash-lock-time,
  # 160 px light), its clock with the PIN pad open, and its 18 px page text
  # (PIN button, alert, hint).
  - id: font_lock_time
    file: {type: gfonts, family: Roboto, weight: 300}
    size: ${font_size_lock_time}
    glyphs: "0123456789:. APM"
  - id: font_lock
    file: {type: gfonts, family: Roboto, weight: 300}
    size: ${font_size_lock}
    glyphs: "0123456789:. APM"
  - id: font_text
    file: "gfonts://Roboto"
    size: ${font_size_text}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_text_bold
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_text}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true

  # The browser's in-between sizes (dashboard.css at 1280x800): 20 px tab
  # labels (.dash-tab, 600 → bold) and NOW / NEXT room line (.dash-nn-meta),
  # 28 px bold NOW / NEXT titles (.dash-nn-title), 24 px message and @here
  # text (.dash-chat-text, .dash-alert-text) and the lock screen's household
  # and date with the PIN pad open, 15 px picture-view captions
  # (.dash-pv-cap), 13 px bold tags and badges (.dash-tag in a message,
  # .dash-tab-badge) and 11 px bold small caps (.dash-pv-sec: all-small-caps
  # on a 16 px line, drawn as capitals at 0.7 em).
  - id: font_medium
    file: "gfonts://Roboto"
    size: ${font_size_medium}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_medium_bold
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_medium}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_heading
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_large}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_message
    file: "gfonts://Roboto"
    size: ${font_size_message}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_caption
    file: "gfonts://Roboto"
    size: ${font_size_caption}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_tag
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_tag}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  - id: font_micro
    file: {type: gfonts, family: Roboto, weight: bold}
    size: ${font_size_micro}
    glyphsets: [GF_Latin_Core]
    ignore_missing_glyphs: true
  # The clock on a person's page (.dash-clock-sm: 4rem, weight 300).
  - id: font_clock_small
    file: {type: gfonts, family: Roboto, weight: 300}
    size: ${font_size_clock_small}
    glyphs: "0123456789:. APM"

lvgl:
  default_font: font_body
