# Guition JC8012P4A1 hardware definition.
#
# ESP32-P4 host, ESP32-C6 co-processor for Wi-Fi + Bluetooth (esp32_hosted over
# SDIO), 10.1" 800x1280 MIPI-DSI panel (native portrait, rotated to landscape
# by LVGL) and a GSL3680 capacitive touch controller (driven by ESPHome's
# gsl3670 platform, same chip family).
#
# Written from the ESPHome 2026.9.1 component documentation and source.

esp32:
  variant: esp32p4
  engineering_sample: ${engineering_sample}
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: hex
  speed: 200MHz

# 2.5 V for the MIPI-DSI PHY.
esp_ldo:
  - channel: 3
    voltage: 2.5V

esp32_hosted:
  variant: esp32c6
  active_high: true
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  sdio_frequency: 40MHz

# The USB-C port is a USB-UART bridge on UART0. Keep the logger (and therefore
# improv_serial and ESP Web Tools) on it.
logger:
  hardware_uart: UART0

i2c:
  - id: i2c_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23
    frequency: 20kHz

display:
  - platform: mipi_dsi
    id: main_display
    model: ${display_model}
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gsl3670
    id: main_touch
    model: GUITION-JC8012P4A1
    i2c_id: i2c_bus
    display: main_display

lvgl:
  id: lvgl_comp
  displays:
    - main_display
  touchscreens:
    - main_touch
  # Native panel is portrait 800x1280; the dashboard is landscape 1280x800.
  rotation: ${display_rotation}
  buffer_size: 25%
  # socialhome_display draws into this page at runtime.
  pages:
    - id: main_page
