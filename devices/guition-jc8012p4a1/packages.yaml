# Everything a Guition JC8012P4A1 dashboard needs, minus the node identity.
#
# Included by builds/guition-jc8012p4a1*.yaml (CI) and, as a remote package,
# by devices/guition-jc8012p4a1/esphome.yaml (user-adoptable config).

substitutions:
  device_slug: guition-jc8012p4a1
  display_model: JC8012P4A1
  display_rotation: "90"
  # Guition's shipping boards use pre-v3.0 ESP32-P4 silicon.
  engineering_sample: "true"
  screen_width: "1280"
  screen_height: "800"
  ui_scale: "1.0"
  # dashboard.css at 1280x800: 16 px labels, 22 px body, 28 px notes,
  # 32 px titles, 48 px names, 104 px clock, 160 px night (and lock) clock;
  # the lock screen's 96 px clock with the PIN pad open and 18 px text.
  font_size_small: "16"
  font_size_body: "22"
  font_size_large: "28"
  font_size_title: "32"
  font_size_display: "48"
  font_size_clock: "104"
  font_size_night: "160"
  font_size_lock: "96"
  font_size_text: "18"

packages:
  base: !include ../../common/base.yaml
  device: !include device/device.yaml
  fonts: !include device/fonts.yaml
  network: !include ../../common/network.yaml
  api: !include ../../common/api.yaml
  ota: !include ../../common/ota.yaml
  update: !include ../../common/update.yaml
  update_coprocessor: !include ../../common/update_esp32_hosted.yaml
  time: !include ../../common/time.yaml
  backlight: !include ../../common/backlight.yaml
  improv: !include ../../common/improv.yaml
  bluetooth_proxy: !include ../../common/bluetooth_proxy.yaml

socialhome_display:
  id: socialhome
  lvgl_id: lvgl_comp
  screen_width: ${screen_width}
  screen_height: ${screen_height}
  ui_scale: ${ui_scale}
  model: ${device_slug}
  backlight_id: backlight
  time_id: sntp_time
  fonts:
    small: font_small
    label: font_label
    body: font_body
    body_bold: font_body_bold
    large: font_large
    title: font_title
    display: font_display
    clock: font_clock
    night: font_night
    lock: font_lock
    text: font_text
    text_bold: font_text_bold
